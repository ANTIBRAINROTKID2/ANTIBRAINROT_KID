<script>
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

const cursor = document.getElementById('cursor');
const TRAIL_POOL = 24;
const trailPool = [];
let trailIndex = 0;

if (finePointer && !reduceMotion) {
  for (let i = 0; i < TRAIL_POOL; i++) {
    const particle = document.createElement('div');
    particle.classList.add('particle');
    particle.style.display = 'none';
    document.body.appendChild(particle);
    trailPool.push(particle);
  }
  document.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    if (Math.random() < 0.35) createTrailParticle(e.clientX, e.clientY);
  });
}

function createTrailParticle(x, y) {
  const particle = trailPool[trailIndex];
  trailIndex = (trailIndex + 1) % TRAIL_POOL;
  const size = Math.random() * 5 + 3;
  particle.style.display = 'block';
  particle.style.width = size + 'px';
  particle.style.height = size + 'px';
  particle.style.left = x + 'px';
  particle.style.top = y + 'px';
  const fallDistance = Math.random() * 90 + 50;
  const duration = Math.random() * 900 + 700;
  particle.getAnimations().forEach(a => a.cancel());
  particle.animate([
    { transform: 'translate(0, 0)', opacity: 0.85 },
    { transform: `translate(${Math.random() * 18 - 9}px, ${fallDistance}px)`, opacity: 0 }
  ], {
    duration: duration,
    easing: 'ease-out'
  });
  setTimeout(() => { particle.style.display = 'none'; }, duration);
}

const texts = ["Team of hacking and bypass.", "Big community.", "Join Today!"];
let currentIndex = 0;
const typed = document.getElementById("typed");

function typeWriter(text, i, callback) {
  if (i < text.length) {
    typed.textContent = text.substring(0, i + 1);
    setTimeout(() => typeWriter(text, i + 1, callback), 60);
  } else {
    typed.textContent = text;
    setTimeout(callback, 1800);
  }
}
function deleteText(text, i, callback) {
  if (i > 0) {
    typed.textContent = text.substring(0, i - 1);
    setTimeout(() => deleteText(text, i - 1, callback), 35);
  } else {
    callback();
  }
}
function startTypingCycle() {
  const currentText = texts[currentIndex];
  typeWriter(currentText, 0, () => {
    deleteText(currentText, currentText.length, () => {
      currentIndex = (currentIndex + 1) % texts.length;
      startTypingCycle();
    });
  });
}
if (reduceMotion) {
  typed.textContent = texts[0];
} else {
  startTypingCycle();
}

function openPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() {
  openPage('home');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') goHome();
});

const SCRIPT_MAP = {
  hub: {
    text: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/ANTIBRAINROTKID2/ANTIBRAINROT_KID-Hub-loadscreen/refs/heads/main/LoadScreen"))()',
    btnId: 'hubBtn'
  },
  searcher: {
    text: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/ANTIBRAINROTKID2/ScriptBlox-Searcher/refs/heads/main/MainScript"))()',
    btnId: 'searcherBtn'
  },
  lucky: {
    text: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/ANTIBRAINROTKID2/Lucky-Hub-Lucky-Block-Battlegrounds-/refs/heads/main/Kid"))()',
    btnId: 'luckyBtn'
  }
};

function copyScript(type) {
  const entry = SCRIPT_MAP[type];
  if (!entry) return;
  const btn = document.getElementById(entry.btnId);
  const originalText = btn.textContent;
  const flash = (label) => {
    btn.classList.add('copied');
    btn.textContent = label;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = originalText;
    }, 1500);
  };
  navigator.clipboard.writeText(entry.text).then(() => {
    flash('Copied script!');
  }).catch(() => {
    flash('Copy failed');
  });
}

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let bgParticles = [];
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);
function createBgParticles() {
  bgParticles = [];
  const count = reduceMotion ? 20 : 80;
  for (let i = 0; i < count; i++) {
    bgParticles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2,
      dx: (Math.random() - 0.5) * 0.5,
      dy: (Math.random() - 0.5) * 0.5
    });
  }
}
createBgParticles();
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";
  bgParticles.forEach(p => {
    p.x += p.dx; p.y += p.dy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();
</script>
